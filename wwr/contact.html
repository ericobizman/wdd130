<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="description"
      content="Contact White Water Rafting for reservations, trip information, questions, or customer support. We're here to help you plan your next rafting adventure.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Okoro Eric">

    <title>Contact Us | Erico White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.jpg" alt="Erico White Water Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <h1>White Water Rafting Company</h1>

        <section class="company-info">
            <p>2 Ade Abiodun Street, Off Olumo Street</p>
            <p>Ogun State, Nigeria</p>
            <p>+234 703 937 2919</p>
            <p>info@ericowhitewater.com</p>
        </section>

        <section class="contact-container">

            <div class="map">
                <h2>Our Location</h2>

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d10014.551438799526!2d3.183099484429955!3d6.669718916855989!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1785856078819!5m2!1sen!2sng"
                  loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

            <div class="contact-form">
                <h2>Contact Us</h2>

                <form action="#" method="post">

                    <div class="form-item">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset>

                        <legend>Message Purpose</legend>

                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="website">
                            <input type="radio" id="website" name="purpose" value="website">
                            Website Suggestion
                        </label>

                    </fieldset>

                    <div class="form-item">
                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="6"></textarea>
                    </div>

                    <div class="newsletter">

                        <input type="checkbox" id="newsletter" name="newsletter">

                        <label for="newsletter">
                            Please subscribe me to the monthly newsletter
                        </label>

                    </div>

                    <button type="submit">
                        Get in Touch!
                    </button>

                </form>

            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/raft1.jpg" alt="John Smith - Lead River Guide">
                    <figcaption>
                        John Smith<br>
                        Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/raft2.jpg" alt="Sarah Johnson - Reservation Manager">
                    <figcaption>
                        Sarah Johnson<br>
                        Reservation Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/raft3.jpg" alt="Michael Brown - Safety Instructor">
                    <figcaption>
                        Michael Brown<br>
                        Safety Instructor
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 | Erico White Water Rafting | Okoro Eric</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
